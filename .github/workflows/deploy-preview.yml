name: Deploy Preview to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: npm run deploy
          secrets: |
            RESEND_API_KEY
            GHL_WEBHOOK_URL
        env:
          # Public measurement ID (must be present at build time for Next.js inlining)
          NEXT_PUBLIC_GA_ID: G-13HBCP9RZB
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GHL_WEBHOOK_URL: ${{ secrets.GHL_WEBHOOK_URL }}

      - name: Sync canonical Cloudflare redirects (single-hop)
        continue-on-error: true
        run: npm run cf:sync-redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: callpreferredplumbing.com
