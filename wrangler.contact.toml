name = "preferred-plumbing-contact"
main = "workers/contact.ts"
compatibility_date = "2026-10-27"
workers_dev = false

[[routes]]
pattern = "www.callpreferredplumbing.com/api/contact*"
zone_name = "callpreferredplumbing.com"

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[send_email]]
name = "EMAIL"
allowed_destination_addresses = [
  "preferredhnorris@gmail.com",
  "preferredrnorris@gmail.com",
]

[vars]
CONTACT_TO_EMAIL = "preferredhnorris@gmail.com,preferredrnorris@gmail.com"
CONTACT_FROM_EMAIL = "quotes@callpreferredplumbing.com"
